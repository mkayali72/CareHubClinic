{% extends "base.html" %}

{% block content %}
  <section class="rounded-3xl border border-slate-200 bg-white p-8 shadow-sm">
    <p class="text-sm font-semibold text-indigo-600">Authenticated landing page</p>
    <h2 class="mt-3 text-3xl font-semibold tracking-tight text-slate-950">
      Welcome, {{ user.full_name }} ({{ user.role.value }})
    </h2>
    <p class="mt-4 max-w-2xl text-base leading-7 text-slate-600">
      Your session is active. Clinic modules will be added after the foundational
      data model and access rules are extended.
    </p>
    <form class="mt-8" method="post" action="/logout" hx-post="/logout">
      <button class="rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:border-slate-300 hover:bg-slate-50" type="submit">
        Sign out
      </button>
    </form>
  </section>
{% endblock %}
