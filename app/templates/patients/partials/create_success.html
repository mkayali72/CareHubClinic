<div id="patient-form-container" class="rounded-3xl border border-emerald-200 bg-emerald-50 p-6">
  <p class="text-sm font-semibold text-emerald-700">Patient created</p>
  <div class="mt-2 flex flex-wrap items-center justify-between gap-4">
    <p class="text-sm text-emerald-900">{{ patient.name }} is now in the patient directory.</p>
    <a class="rounded-xl bg-emerald-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-800" href="/patients/{{ patient.id }}">Open patient</a>
  </div>
</div>
