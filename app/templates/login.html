<!doctype html>
<html lang="en" data-theme="light" data-font-size="normal" data-contrast="standard">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>{{ page_title }} · OB/GYN Clinic</title>
    <script>
      (function () {
        try {
          const root = document.documentElement;
          root.dataset.theme = localStorage.getItem("obgyn-theme") || "light";
          root.dataset.fontSize = localStorage.getItem("obgyn-font-size") || "normal";
          root.dataset.contrast = localStorage.getItem("obgyn-contrast") || "standard";
        } catch (error) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
  </head>
  <body class="login-page min-h-screen">
    <main class="relative flex min-h-screen items-center justify-center px-4 py-16 sm:px-6 sm:py-12">
      <div class="absolute right-4 top-4 flex flex-wrap justify-end gap-1.5 sm:right-6 sm:top-6 sm:gap-2" aria-label="Accessibility and display options">
        <div class="flex items-center rounded-xl border border-white/20 bg-white/10 p-0.5" role="group" aria-label="Text size">
          <button class="touch-target rounded-lg px-2 text-xs font-bold text-white hover:bg-white/10" type="button" data-font-size="small" aria-label="Decrease text size">A−</button>
          <button class="touch-target rounded-lg px-2 text-sm font-bold text-white hover:bg-white/10" type="button" data-font-size="normal" aria-label="Reset text size">A</button>
          <button class="touch-target rounded-lg px-2 text-base font-bold text-white hover:bg-white/10" type="button" data-font-size="large" aria-label="Increase text size">A+</button>
        </div>
        <button class="touch-target rounded-xl border border-white/20 bg-white/10 px-3 text-xs font-semibold text-white hover:bg-white/20" type="button" data-contrast-toggle aria-pressed="false"><span data-contrast-label>Contrast</span></button>
        <button class="touch-target rounded-xl border border-white/20 bg-white/10 px-3 text-xs font-semibold text-white hover:bg-white/20" type="button" data-theme-toggle aria-pressed="false"><span aria-hidden="true">◐</span> <span data-theme-label>Dark</span></button>
      </div>
      <section class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl shadow-indigo-950/20">
        <div class="flex items-center gap-3">
          <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-indigo-600 text-sm font-bold text-white">OC</div>
          <div>
            <p class="text-sm font-semibold text-slate-950">OB/GYN Clinic</p>
            <p class="text-xs text-slate-500">Clinic operations</p>
          </div>
        </div>
        <div class="mt-10">
          <p class="text-sm font-semibold text-indigo-600">Staff access</p>
          <h1 class="mt-2 text-3xl font-semibold tracking-tight text-slate-950">Sign in to continue</h1>
          <p class="mt-3 text-sm leading-6 text-slate-500">Use your clinic account to access the operations workspace.</p>
        </div>
        <form class="mt-8 space-y-5" method="post" action="/login" hx-post="/login" hx-target="#login-feedback" hx-swap="innerHTML">
          <div>
            <label class="text-sm font-medium text-slate-700" for="email">Email</label>
            <input class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div>
            <label class="text-sm font-medium text-slate-700" for="password">Password</label>
            <input class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <div id="login-feedback" aria-live="polite">
            {% if message %}
              <p class="rounded-xl bg-emerald-50 px-4 py-3 text-sm text-emerald-700">{{ message }}</p>
            {% endif %}
            {% if error %}
              <p class="rounded-xl bg-rose-50 px-4 py-3 text-sm text-rose-700">{{ error }}</p>
            {% endif %}
          </div>
          <button class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200" type="submit">
            Sign in
          </button>
        </form>
      </section>
    </main>
    <script src="{{ url_for('static', path='js/app.js') }}"></script>
    <script>
      const token = document.querySelector('meta[name="csrf-token"]')?.content;
      document.querySelectorAll('form[method="post"], form:not([method])').forEach((form) => {
        if (!token || form.querySelector('input[name="_csrf_token"]')) return;
        const field = document.createElement("input");
        field.type = "hidden";
        field.name = "_csrf_token";
        field.value = token;
        form.appendChild(field);
      });
      document.body.addEventListener("htmx:configRequest", (event) => {
        if (token) event.detail.headers["X-CSRF-Token"] = token;
      });
    </script>
  </body>
</html>
