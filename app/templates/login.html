<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>{{ page_title }} · OB/GYN Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
  </head>
  <body class="min-h-screen bg-slate-950">
    <main class="flex min-h-screen items-center justify-center px-6 py-12">
      <section class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl shadow-indigo-950/20">
        <div class="flex items-center gap-3">
          <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-indigo-600 text-sm font-bold text-white">OC</div>
          <div>
            <p class="text-sm font-semibold text-slate-950">OB/GYN Clinic</p>
            <p class="text-xs text-slate-500">Clinic operations</p>
          </div>
        </div>
        <div class="mt-10">
          <p class="text-sm font-semibold text-indigo-600">Staff access</p>
          <h1 class="mt-2 text-3xl font-semibold tracking-tight text-slate-950">Sign in to continue</h1>
          <p class="mt-3 text-sm leading-6 text-slate-500">Use your clinic account to access the operations workspace.</p>
        </div>
        <form class="mt-8 space-y-5" method="post" action="/login" hx-post="/login" hx-target="#login-feedback" hx-swap="innerHTML">
          <div>
            <label class="text-sm font-medium text-slate-700" for="email">Email</label>
            <input class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <div>
            <label class="text-sm font-medium text-slate-700" for="password">Password</label>
            <input class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <div id="login-feedback" aria-live="polite">
            {% if error %}
              <p class="rounded-xl bg-rose-50 px-4 py-3 text-sm text-rose-700">{{ error }}</p>
            {% endif %}
          </div>
          <button class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-200" type="submit">
            Sign in
          </button>
        </form>
      </section>
    </main>
    <script>
      const token = document.querySelector('meta[name="csrf-token"]')?.content;
      document.querySelectorAll('form[method="post"], form:not([method])').forEach((form) => {
        if (!token || form.querySelector('input[name="_csrf_token"]')) return;
        const field = document.createElement("input");
        field.type = "hidden";
        field.name = "_csrf_token";
        field.value = token;
        form.appendChild(field);
      });
      document.body.addEventListener("htmx:configRequest", (event) => {
        if (token) event.detail.headers["X-CSRF-Token"] = token;
      });
    </script>
  </body>
</html>
